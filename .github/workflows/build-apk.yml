name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          # Tự động tìm thư mục chứa gradlew
          BUILD_DIR=$(find . -name "gradlew" -type f -print -quit | xargs dirname)
          echo "Đang build tại thư mục: $BUILD_DIR"
          cd $BUILD_DIR
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PinkStreakKeeper-debug
          path: "**/build/outputs/apk/debug/*.apk"
